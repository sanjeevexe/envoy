routine: starbucks_get_drink_calories
app: com.starbucks.mobilecard
version: 2
status: draft
intent: Check how many calories are in a Starbucks drink
description: Opens a Starbucks menu item, uses its preselected Grande size, and reads the calorie count shown on the product page.
patterns: [how many calories are in a drink, what is the calorie count for a menu item, check the calories in a drink]
outputs: [calories]
start: fresh_launch
inputs:
  drink_name: {type: text, description: The Starbucks menu drink to look up., example: Caffè Latte}
steps:
- id: tap_order
  intent: Tap Order to open the ordering section
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Order
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: button2, text: 'No, thanks', kind: Button}
  - element_present: {resource_id: button1, text: Share location, kind: Button}
  risk: reversible
  note: trace step 1
- id: dismiss_location_prompt
  intent: Go back to dismiss the location permission prompt
  optional: true
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action: {back: true}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: stores_tab_empty_state_title, text: No cafés found, kind: Text}
  - element_present: {resource_id: stores_tab_empty_state_body, text: 'Try searching another area, removing filters, or zooming in or out to get
        a better look.', kind: Text}
  risk: read
  note: "trace step 2 · one-time screen: optional"
- id: tap_skip
  intent: Tap Skip to bypass café selection
  optional: true
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Skip
      kind: Button
      cls: View
      siblings: [Search]
      in_list: false
      position: [0.923, 0.084]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: button2, text: Choose a café, kind: Button}
  - element_present: {resource_id: button1, text: 'Yes', kind: Button}
  risk: reversible
  note: "trace step 3 · one-time screen: optional"
- id: confirm_skip_to_menu
  intent: Confirm skipping to the menu
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      resource_id: button1
      text: 'Yes'
      kind: Button
      cls: Button
      siblings: [Choose a café]
      in_list: false
      position: [0.737, 0.581]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: button2, text: Choose a café, kind: Button}
  risk: reversible
  note: trace step 4
- id: tap_search_menu
  intent: "Tap Search Menu to look for {{drink_name}}"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Search Menu
      kind: Button
      cls: Button
      in_list: true
      position: [0.941, 0.08]
  post:
  - {screen_changed: true}
  - element_present: {text: Search Menu, kind: EditText}
  risk: reversible
  note: "trace step 5 · repaired by hand (Oct 28): the search screen, not a recent search for the drink"
- id: search_drink_name
  intent: "Search the menu for {{drink_name}}"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  - element_present: {text: Search Menu, kind: EditText}
  action:
    type:
      field: {text: Search Menu, hint: Search Menu, kind: EditText, cls: EditText}
      value: "{{drink_name}}"
      submit: true
  post:
  - element_present: {text: Results, kind: Text}
  risk: read
  note: "repaired by hand (Oct 28): replaces trace step 7 (tap a recent search), which the app's recent searches made ambiguous"
- id: find_open_drink_product
  intent: "Scroll to {{drink_name}} if it is not on screen"
  pre:
  - element_present: {text: Results, kind: Text}
  action:
    scroll_until:
      target:
        text_has: "{{drink_name}}"
        kind: Button
        cls: RelativeLayout
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{drink_name}}"
      kind: Button
      cls: RelativeLayout
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_drink_product
  intent: "Open {{drink_name}} from the results to read its calories for the preselected size"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text_has: "{{drink_name}}"
      kind: Button
      cls: RelativeLayout
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {text: Size options, kind: Text}
  - element_present:
      text: "{{drink_name}}"
      kind: Text
  risk: reversible
  extract:
    calories:
      near: "{{drink_name}}"
      first_in_list: false
      next_element: true
      expect_digits: true
      switch: false
  note: "trace step 8 · repaired by hand (Oct 28): its after-checks name the drink's page (the title and Size options), not size_name, which is no input"
