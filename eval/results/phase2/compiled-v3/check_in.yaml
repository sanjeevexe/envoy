routine: skylark_check_in_flight
app: com.skylark.air
version: 2
status: active
intent: Check in for a SkyLark flight
description: Opens My Trips in SkyLark Air, selects the trip matching the requested destination, completes the passenger, hazardous-materials
  and review steps, confirms check-in, and then reopens the trip to verify the checked-in status and return the seat, gate and boarding details.
patterns: [Check me in for my flight, Check in for my upcoming flight, Please check me in, Check in for my trip]
outputs: [check_in_status, seat, gate, boarding_time, boarding_group]
start: fresh_launch
inputs:
  trip_city: {type: text, description: Destination city of the flight to check in for., example: Denver}
steps:
- id: open_my_trips
  intent: Tap My Trips to find the flight to check in for
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: find_open_trip_to_destination
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_trip_to_destination
  intent: "Open the trip to {{trip_city}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: btn_checkin, text: Check in, kind: Button}
  risk: reversible
  note: trace step 2
- id: start_check_in
  intent: Tap Check in to start check-in
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_checkin
      text: Check in
      kind: Button
      cls: View
      siblings: [Known traveler number]
      in_list: false
      position: [0.5, 0.484]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: cb_passenger_0, kind: Toggle}
  - element_present: {resource_id: btn_continue, text: Continue, kind: Button}
  risk: irreversible
  note: trace step 3
- id: select_passenger
  intent: Select the passenger to check in
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: cb_passenger_0
      kind: Toggle
      cls: View
      siblings: ['Who''s checking in?']
      in_list: false
      position: [0.5, 0.238]
  post:
  - toggle_is:
      target: {resource_id: cb_passenger_0, kind: Toggle}
      value: 'on'
  risk: reversible
  note: trace step 4
- id: continue_after_passenger
  intent: Tap Continue after selecting the passenger
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_continue
      text: Continue
      kind: Button
      cls: View
      siblings: ['Who''s checking in?']
      in_list: false
      position: [0.5, 0.295]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: cb_hazmat, text: I'm not carrying hazardous materials, kind: Toggle}
  risk: reversible
  note: trace step 5
- id: confirm_no_hazardous_materials
  intent: Confirm that you are not carrying hazardous materials
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: cb_hazmat
      text: I'm not carrying hazardous materials
      kind: Toggle
      cls: View
      siblings: [Travel safety, 'Lithium batteries, fireworks, flammable liquids and other hazardous materials are not allowed in checked or carry-on
          bags.']
      in_list: false
      position: [0.5, 0.33]
  post:
  - toggle_is:
      target: {resource_id: cb_hazmat, text: I'm not carrying hazardous materials, kind: Toggle}
      value: 'on'
  risk: reversible
  note: trace step 6
- id: continue_after_hazardous_materials
  intent: Tap Continue after the hazardous-materials confirmation
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_continue
      text: Continue
      kind: Button
      cls: View
      siblings: [Travel safety, 'Lithium batteries, fireworks, flammable liquids and other hazardous materials are not allowed in checked or carry-on
          bags.']
      in_list: false
      position: [0.5, 0.388]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: btn_looks_good, text: Looks good, kind: Button}
  risk: reversible
  note: trace step 7
- id: confirm_trip_review
  intent: Tap Looks good to confirm the trip review
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_looks_good
      text: Looks good
      kind: Button
      cls: View
      siblings: [Review your trip]
      in_list: false
      position: [0.5, 0.365]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: btn_confirm_checkin, text: Confirm check-in, kind: Button}
  - element_present: {resource_id: row_confirm_passenger, text: Passenger, kind: Text}
  risk: reversible
  note: trace step 8
- id: confirm_check_in
  intent: Tap Confirm check-in to finish checking in
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_confirm_checkin
      text: Confirm check-in
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.365]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Boarding pass, kind: Text}
  - element_present: {resource_id: text_checked_in, kind: Text}
  risk: irreversible
  note: trace step 9
- id: dismiss_boarding_pass
  intent: Tap Done to dismiss the boarding pass
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_done
      text: Done
      kind: Button
      cls: View
      siblings: [Boarding pass barcode]
      in_list: false
      position: [0.5, 0.635]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  - element_present: {resource_id: text_greeting, text: 'Good morning, Maya', kind: Text}
  risk: reversible
  note: trace step 10
- id: reopen_my_trips
  intent: Tap My Trips to verify check-in is complete
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 11
- id: find_reopen_trip_to_destination
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: reopen_trip_to_destination
  intent: "Open the trip to {{trip_city}} again to confirm it is checked in"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  risk: reversible
  extract:
    check_in_status:
      locator: {resource_id: text_checked_in, kind: Text}
      first_in_list: false
      next_element: false
    seat:
      near: Seat
      locator: {resource_id: row_seat, kind: Text}
      segment: 1
      first_in_list: false
      next_element: false
    gate:
      near: Gate
      locator: {resource_id: row_gate, kind: Text}
      segment: 1
      first_in_list: false
      next_element: false
    boarding_time:
      near: Boarding
      locator: {resource_id: row_boarding, kind: Text}
      segment: 1
      first_in_list: false
      next_element: false
    boarding_group:
      near: Boarding
      locator: {resource_id: row_boarding, kind: Text}
      segment: 2
      first_in_list: false
      next_element: false
  note: trace step 12
