routine: skylark_air_check_in_flight
app: com.skylark.air
version: 2
status: active
intent: Check in for a SkyLark flight
description: Check in for a SkyLark flight to a selected city by going to My Trips, opening that trip, selecting the passenger, confirming no
  hazardous materials, and confirming check-in to obtain the boarding pass.
patterns: [check me in for my flight, check in for my trip, please check me in, complete flight check-in]
outputs: [seat, gate, boarding_time]
start: fresh_launch
inputs:
  trip_city: {type: text, description: City of trip to check in, example: Denver}
steps:
- id: open_my_trips
  intent: "(single selection) Tap 'My Trips' to find the flight to {{trip_city}}"
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
