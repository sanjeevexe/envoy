routine: skylark_get_gate
app: com.skylark.air
version: 1
status: retired
intent: Find the departure gate for a SkyLark flight
description: Opens My Trips in SkyLark, selects the trip matching the requested city, and reads the departure gate from the trip details.
patterns: [What gate does my flight leave from, What is my departure gate, Find the gate for my flight]
outputs: [gate]
start: fresh_launch
inputs:
  trip_city: {type: text, description: The city of the trip whose gate is requested., example: Denver}
steps:
- id: open_my_trips
  intent: "Open My Trips to find the {{trip_city}} flight"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 1
- id: find_open_trip
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_trip
  intent: "Open the {{trip_city}} flight to read its gate"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      text: "Trip to {{trip_city}}"
      kind: Text
  risk: reversible
  extract:
    gate: {near: Gate, first_in_list: false, next_element: true, expect_digits: false}
  note: trace step 2
