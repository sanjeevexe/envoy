routine: gmail_search_mail
app: com.google.android.gm
version: 1
status: draft
intent: Search Gmail for a term and report the subject of the first result
description: Searches Gmail using a provided search term, opens the first matching email, and reports that email's subject.
patterns: [search my mail and tell me the first subject, find the first email matching a search term, what is the subject of the first matching
    email, search my email for this and report the top result]
outputs: [first_result_subject]
start: fresh_launch
inputs:
  search_query: {type: text, description: The term to search for in Gmail., example: DoorDash}
steps:
- id: tap_search_in_mail
  intent: Tap the Search in mail field to start a search
  pre:
  - {app_foreground: com.google.android.gm}
  - element_present: {resource_id: compose_button, text: Compose, kind: Button}
  action:
    tap:
      resource_id: open_search
      text: Search in mail
      hint: Search in mail
      kind: EditText
      cls: EditText
      parent: toolbar_wrapped_around_search_bar
      siblings: [Open navigation drawer]
      in_list: true
      position: [0.496, 0.088]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: compose_button, text: Compose, kind: Button}
  risk: reversible
  note: trace step 1
- id: type_search_query
  intent: "Type {{search_query}} into the Search in mail field and run the search"
  pre:
  - {app_foreground: com.google.android.gm}
  action:
    type:
      field:
        resource_id: open_search_view_edit_text
        text: Search in mail
        hint: Search in mail
        kind: EditText
        cls: EditText
        parent: open_search_view_text_container
        in_list: true
        position: [0.519, 0.088]
      value: "{{search_query}}"
      submit: true
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 2
- id: open_first_search_result
  intent: "Tap the first search result matching {{search_query}} to open it and confirm its subject"
  pre:
  - {app_foreground: com.google.android.gm}
  action:
    tap:
      kind: Button
      cls: FrameLayout
      parent: thread_list_view
      in_list: true
      position: [0.5, 0.289]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: item_pager, kind: List}
  - element_present: {resource_id: archive, text: Archive, kind: Button}
  risk: reversible
  extract:
    first_result_subject:
      locator: {resource_id: subject_and_folder_view, kind: Button}
      after: Inbox
  note: trace step 3
