routine: joplin_lookup_ingredient_quantity
app: com.google.android.apps.nexuslauncher
version: 1
status: draft
intent: Find the quantity of an ingredient in a recipe in the Joplin app
description: Search for a named recipe in the Joplin app, open the recipe note, and read the amount and unit listed for a specified ingredient.
patterns: ['What quantity of an ingredient do I need for a recipe?', 'How much of an ingredient is in a recipe?', Find the amount of an ingredient
    in a Joplin recipe, Check an ingredient quantity in a recipe]
outputs: [ingredient_quantity]
start: fresh_launch
inputs:
  recipe_name: {type: text, description: The name of the recipe to look up., example: Chicken Alfredo}
  ingredient_name: {type: text, description: The ingredient whose quantity is needed., example: spirulina}
steps:
- id: launch_joplin
  intent: Launch the Joplin app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: net.cozic.joplin}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: read
  note: trace step 2
- id: tap_search
  intent: Tap Search to find a recipe
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text: Search
      kind: Button
      cls: Button
      siblings: [Sidebar, All notes, Sort notes by]
      in_list: false
      position: [0.818, 0.082]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: input_method_nav_ime_switcher, text: Switch input method, kind: Button}
  risk: reversible
  note: trace step 5
- id: type_recipe_name
  intent: "Type {{recipe_name}} into the search field"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    type:
      field:
        text: ''
        kind: EditText
        cls: EditText
        siblings: [Clear]
        in_list: false
        position: [0.445, 0.133]
      value: "{{recipe_name}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      text: "{{recipe_name}}"
      kind: EditText
  risk: reversible
  note: trace step 6
- id: find_open_recipe
  intent: "Scroll to {{recipe_name}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{recipe_name}}"
        kind: Button
        cls: ViewGroup
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{recipe_name}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_recipe
  intent: "Tap the {{recipe_name}} recipe in the search results to open it and read the quantity of {{ingredient_name}}"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text_has: "{{recipe_name}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: reversible
  extract:
    ingredient_quantity:
      locator:
        text_has: "{{ingredient_name}}"
        kind: Text
      after: "{{ingredient_name}}"
      expect_digits: true
  note: trace step 7
