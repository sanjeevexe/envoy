routine: settings_set_brightness
app: com.google.android.apps.nexuslauncher
version: 1
status: draft
intent: Set the device brightness to maximum in Settings
description: Opens Settings, navigates to Display and Brightness level, then drags the brightness slider all the way to the right until it reaches
  the maximum value.
patterns: [turn brightness to the max, set brightness to maximum, make the screen as bright as possible, increase brightness to full]
outputs: [brightness_level]
start: fresh_launch
steps:
- id: launch_settings
  intent: Launch the Settings app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: com.android.settings}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: settings_homepage_container, kind: List}
  risk: read
  note: trace step 1
- id: scroll_to_display
  intent: Scroll until the Display settings item is visible
  pre:
  - {app_foreground: com.android.settings}
  action:
    scroll_until:
      target:
        text: Display · Dark theme, font size, brightness
        kind: Button
        cls: LinearLayout
        parent: recycler_view
        in_list: true
        position: [0.5, 0.395]
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text: Display · Dark theme, font size, brightness
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.395]
  risk: read
  note: trace step 2 (+1 scrolls)
- id: tap_display
  intent: Tap the Display settings item
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Display · Dark theme, font size, brightness
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.395]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: content_parent, kind: List}
  risk: reversible
  note: trace step 3
- id: tap_brightness_level
  intent: Tap the Brightness level setting to open the brightness slider
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Brightness level
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.348]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 4
- id: swipe_brightness_slider_to_max
  intent: Swipe the brightness slider to the maximum
  pre:
  - {app_foreground: com.android.systemui}
  action:
    swipe:
      from:
        resource_id: brightness_mirror_container
        kind: Text
        cls: FrameLayout
        in_list: false
        position: [0.5, 0.088]
      vector: [0.799, 0.0]
      start: [0.133, 0.076]
      grip: [0.102, 0.262]
  post:
  - {app_foreground: com.android.systemui}
  risk: reversible
  note: trace step 5
- id: swipe_brightness_slider_to_full_max
  intent: Swipe the brightness slider again to ensure it reaches full maximum
  pre:
  - {app_foreground: com.android.systemui}
  action:
    swipe:
      from:
        resource_id: brightness_mirror_container
        kind: Text
        cls: FrameLayout
        in_list: false
        position: [0.5, 0.088]
      vector: [0.27, 0.0]
      start: [0.7, 0.104]
      grip: [0.717, 0.802]
  post:
  - {app_foreground: com.android.systemui}
  risk: reversible
  extract:
