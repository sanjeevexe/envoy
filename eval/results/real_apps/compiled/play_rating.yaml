routine: play_store_get_app_rating
app: com.android.vending
version: 1
status: draft
intent: Get the star rating of an app in the Google Play Store
description: Dismiss the Google Play Store onboarding without signing in, search for the requested app, open its listing, and report the average
  star rating shown for that app without installing anything.
patterns: [what is the star rating of this app, check an app rating in the Play Store, how many stars does this app have, find the app rating
    on Google Play]
outputs: [star_rating]
start: fresh_launch
inputs:
  app_name: {type: text, description: The app to look up in the Google Play Store., example: Duolingo}
steps:
- id: skip_interests_onboarding
  intent: Tap Skip to bypass the interests onboarding
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Skip
      kind: Button
      cls: View
      in_list: false
      position: [0.264, 0.895]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 3
- id: continue_onboarding
  intent: Tap Continue to finish onboarding without signing in
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Continue
      kind: Button
      cls: View
      in_list: false
      position: [0.277, 0.895]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 4
- id: dismiss_offer_prompt
  intent: Tap Not now to dismiss the offer prompt
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Not now
      kind: Button
      cls: View
      in_list: false
      position: [0.277, 0.9]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 5
- id: dismiss_onboarding_tooltip
  intent: Tap Got it to dismiss the onboarding tooltip
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Got it
      kind: Button
      cls: View
      siblings: [Shortcuts to your favorites, 'Tap to find top charts, your favorite genres, and more.']
      in_list: false
      position: [0.223, 0.302]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 6
- id: open_search
  intent: Tap Search to start searching the Play Store
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Search
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.939]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 8
- id: open_search_input
  intent: Tap the search entry to open the search input
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Search or ask Play
      kind: Button
      cls: View
      in_list: false
      position: [0.514, 0.084]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: input_method_nav_ime_switcher, text: Switch input method, kind: Button}
  risk: reversible
  note: trace step 9
- id: type_app_name
  intent: "Type {{app_name}} into the search field"
  pre:
  - {app_foreground: com.android.vending}
  action:
    type:
      field:
        text: Search apps & games
        hint: Search apps & games
        kind: EditText
        cls: EditText
        in_list: false
        position: [0.5, 0.084]
      value: "{{app_name}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      text: "{{app_name}}"
      kind: Button
  risk: reversible
  extract:
    star_rating: {near: Average rating, first_in_list: false, next_element: false, expect_digits: true}
  note: trace step 10
