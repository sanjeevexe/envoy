routine: chipotle_get_menu_item_price
app: com.chipotle.ordering
version: 1
status: draft
intent: Find the price of a Chipotle menu item
description: Uses the preferred ZIP code to select a nearby Chipotle pickup location, opens the Chips & Sides menu, and returns the requested
  item's price.
patterns: [How much is a menu item at Chipotle, Find the price of a Chipotle menu item, Check a Chipotle item price]
outputs: [price]
start: fresh_launch
inputs:
  zip_code: {type: text, description: The ZIP code for the preferred nearby Chipotle location., from_memory: preferred_location.zip_code, example: '10001'}
steps:
