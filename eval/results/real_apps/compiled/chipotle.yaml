      parent: rv_menu
      in_list: true
      position: [0.5, 0.664]
  risk: read
  note: trace step 16 (+1 scrolls)
- id: open_chips_and_sides
  intent: "Tap CHIPS & SIDES to view the price of {{menu_item_name}}"
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: view_container
      text: CHIPS & SIDES
      kind: Button
      cls: ViewGroup
      parent: rv_menu
