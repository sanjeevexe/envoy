routine: joplin_count_meeting_attendees
app: com.google.android.apps.nexuslauncher
version: 1
status: draft
intent: Count attendees for a meeting in the Joplin app
description: Search the Joplin app for a meeting note by its title, open the matching note, and read how many individuals were present.
patterns: ['How many attendees were in a meeting?', 'How many people were present at a meeting?', Count attendees in a meeting note, Number of
    individuals present in a meeting]
outputs: [attendee_count]
start: fresh_launch
inputs:
  meeting_title: {type: text, description: Title of the meeting note to look up., example: Employee Performance Evaluation}
steps:
- id: launch_joplin
  intent: Launch the Joplin app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: net.cozic.joplin}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: read
  note: trace step 1
- id: tap_search
  intent: Tap Search to find a meeting note
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text: Search
      kind: Button
      cls: Button
      siblings: [Sidebar, All notes, Sort notes by]
      in_list: false
      position: [0.818, 0.082]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: fab-content, text: , kind: Text}
  risk: reversible
  note: trace step 2
- id: type_meeting_title
  intent: "Type {{meeting_title}} into the search field"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    type:
      field:
        text: ''
        kind: EditText
        cls: EditText
        siblings: [Clear]
        in_list: false
        position: [0.445, 0.133]
      value: "{{meeting_title}}"
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 3
- id: find_tap_search_result
  intent: "Scroll to {{meeting_title}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{meeting_title}}"
        kind: Button
        cls: ViewGroup
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{meeting_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: tap_search_result
  intent: "Tap the search result for {{meeting_title}}"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text_has: "{{meeting_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 4
- id: find_open_meeting_note
  intent: "Scroll to {{meeting_title}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{meeting_title}}"
        kind: Button
        cls: ViewGroup
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{meeting_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_meeting_note
  intent: "Tap the note titled {{meeting_title}} to open it and view the attendees"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text_has: "{{meeting_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: reversible
  extract:
    attendee_count: {pattern: '(?P<v>\d+)\s*individuals\ were\ present', first_in_list: true, expect_digits: true}
  note: trace step 6
compiled_from:
  task_id: aw-final-standard-1028-114004-d68c
  goal: How many attendees were present in the meeting titled 'Employee Performance Evaluation' in the Joplin app? Express your answer as just
    a single number.
