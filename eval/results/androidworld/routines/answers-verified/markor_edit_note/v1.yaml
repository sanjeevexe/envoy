routine: markor_edit_note
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Add text to the top of a note in Markor
description: Opens the specified note file in Markor, prepends the requested text to the existing note content, navigates back to save, and reopens
  the note to verify the edit.
patterns: [Edit a note in Markor, Add text to the top of a note, Prepend text to my note, Update a note file in Markor]
outputs: [updated_note_content]
start: fresh_launch
inputs:
  note_file_name: {type: text, description: The note file to edit, example: note_SiFbv.txt}
  text_to_add: {type: text, description: The text to add to the top of the note, example: 'Hello, World!'}
steps:
- id: launch_markor
  intent: Launch Markor
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: net.gsantner.markor}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: nav_notebook, text: Files, kind: Text}
  - element_present: {resource_id: navigation_bar_item_labels_group, text: Files, kind: Text}
  risk: read
  note: trace step 1
- id: find_open_note_file
  intent: "Scroll to {{note_file_name}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: opoc_filesystem_item__root
        text: File
        text_has: "{{note_file_name}}"
        kind: Button
        cls: LinearLayout
        parent: ui__filesystem_dialog__list
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: opoc_filesystem_item__root
      text: File
      text_has: "{{note_file_name}}"
      kind: Button
      cls: LinearLayout
      parent: ui__filesystem_dialog__list
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_note_file
  intent: "Tap the file {{note_file_name}} to open the note"
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      resource_id: opoc_filesystem_item__root
      text: File
      text_has: "{{note_file_name}}"
      kind: Button
      cls: LinearLayout
      parent: ui__filesystem_dialog__list
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: toolbar, text: note_SiFbv, kind: Button}
  - element_present: {resource_id: action_undo, text: Undo, kind: Button}
  risk: reversible
  note: trace step 2
- id: prepend_text_to_note
  intent: "Type {{text_to_add}} at the top of the note, followed by the existing note content"
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    type:
      field:
        resource_id: document__fragment__edit__highlighting_editor
        kind: EditText
        cls: EditText
        parent: document__fragment__edit__content_editor__scrolling_parent
        in_list: false
        position: [0.5, 0.519]
      value: "{{text_to_add}}\n{{_field}}"
  post:
  - field_equals:
      field: {resource_id: document__fragment__edit__highlighting_editor, kind: EditText}
      value: "{{text_to_add}}\n{{_field}}"
  risk: reversible
  note: trace step 3
- id: dismiss_keyboard
  intent: Go back to dismiss the keyboard
  optional: true
  pre:
  - {app_foreground: net.gsantner.markor}
  action: {back: true}
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: input_method_nav_ime_switcher, text: Switch input method, kind: Button}
  risk: read
  note: "trace step 4 · closes the keyboard: optional"
- id: return_to_file_list
  intent: Go back to return to the file list and save the note
  pre:
  - {app_foreground: net.gsantner.markor}
  action: {back: true}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: nav_notebook, text: Files, kind: Text}
  - element_present: {resource_id: navigation_bar_item_labels_group, text: Files, kind: Text}
  risk: read
  note: trace step 5
- id: find_reopen_note_file
  intent: "Scroll to {{note_file_name}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: opoc_filesystem_item__root
        text: File
        text_has: "{{note_file_name}}"
        kind: Button
        cls: LinearLayout
        parent: ui__filesystem_dialog__list
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: opoc_filesystem_item__root
      text: File
      text_has: "{{note_file_name}}"
      kind: Button
      cls: LinearLayout
      parent: ui__filesystem_dialog__list
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: reopen_note_file
  intent: "Tap the file {{note_file_name}} to reopen the note and verify the edit"
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      resource_id: opoc_filesystem_item__root
      text: File
      text_has: "{{note_file_name}}"
      kind: Button
      cls: LinearLayout
      parent: ui__filesystem_dialog__list
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: toolbar, text: note_SiFbv, kind: Button}
  - element_present: {resource_id: action_undo, text: Undo, kind: Button}
  risk: reversible
  extract:
    updated_note_content:
      locator: {resource_id: document__fragment__edit__highlighting_editor, kind: EditText}
  note: trace step 6
done:
- text_visible: "{{text_to_add}}"
