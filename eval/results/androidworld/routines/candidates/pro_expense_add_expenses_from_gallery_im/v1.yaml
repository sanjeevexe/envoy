  action:
    tap:
      resource_id: dir_holder
      text: DCIM
      kind: Button
      cls: RelativeLayout
      parent: directories_grid
      in_list: true
      position: [0.25, 0.236]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: media_coordinator, kind: List}
  risk: reversible
  note: trace step 2
- id: search_for_expense_image
