        kind: EditText
        cls: EditText
        parent: top_toolbar_holder
        siblings: [Back]
        in_list: true
        position: [0.358, 0.088]
      value: "{{expense_image_filename}}"
      submit: true
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 4
- id: find_open_expense_image
