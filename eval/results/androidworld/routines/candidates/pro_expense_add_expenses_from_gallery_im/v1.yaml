routine: pro_expense_add_expenses_from_gallery_im
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Add expenses from an image in Simple Gallery Pro to Pro Expense
description: "Opens an expense image from the DCIM folder in Simple Gallery Pro, then adds each listed expense, including its amount, category,\
  \ and note, as a new entry in Pro Expense. Only works when expense_3_note is the one already shown on 'Note: A need'."
patterns: [Add the expenses from this image to Pro Expense, Import expenses from a gallery image into Pro Expense, Enter the expenses shown in
    a photo into Pro Expense]
outputs: [total_outcome, most_recent_expense]
start: fresh_launch
inputs:
  expense_image_filename: {type: text, description: Expense image to look for in Simple Gallery Pro, example: expenses.jpg}
  expense_1_name: {type: text, description: Name of the first expense shown in the image, example: Dress}
  expense_1_amount: {type: text, description: Amount of the first expense, example: '436.35'}
  expense_1_category: {type: text, description: Category of the first expense, example: Clothes}
  expense_1_note: {type: text, description: Note for the first expense, example: Paid by card}
  expense_2_name: {type: text, description: Name of the second expense shown in the image, example: Furnishing}
  expense_2_amount: {type: text, description: Amount of the second expense, example: '350.07'}
  expense_2_category: {type: text, description: Category of the second expense, example: Housing}
  expense_2_note: {type: text, description: Note for the second expense, example: A need}
  expense_3_name: {type: text, description: Name of the third expense shown in the image, example: Dental Care}
  expense_3_amount: {type: text, description: Amount of the third expense, example: '39.54'}
  expense_3_category: {type: text, description: Category of the third expense, example: Health Care}
  expense_3_note: {type: text, description: Note for the third expense, example: A need}
