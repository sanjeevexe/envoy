routine: markor_create_note
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Create a note in Markor, paste clipboard content into it, and save it
description: Creates a new file in Markor with the requested name and extension, pastes the current clipboard content into the editor, and saves
  the note.
patterns: [Create a note in Markor, Make a new note and paste into it, 'Create a text note, paste the clipboard, and save', New Markor file with
    pasted content]
outputs: [note_title, pasted_content]
start: fresh_launch
inputs:
  note_name: {type: text, description: 'Base name of the note file to create, without the extension.', example: 2023_09_08_active_umbrella}
  file_extension: {type: text, description: File extension for the new note., example: .txt}
steps:
- id: launch_markor
  intent: Launch the Markor app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: net.gsantner.markor}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: nav_notebook, text: Files, kind: Text}
  - element_present: {resource_id: navigation_bar_item_labels_group, text: Files, kind: Text}
  risk: read
  note: trace step 1
- id: tap_create_new_file
  intent: Tap 'Create a new file or folder' to start creating a new note
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      resource_id: fab_add_new_item
      text: Create a new file or folder
      kind: Button
      cls: ImageButton
      parent: main_content
      in_list: false
      position: [0.893, 0.864]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: new_file_dialog__name, text: my_note, kind: EditText}
  - element_present: {resource_id: new_file_dialog__ext, text: .md, kind: EditText}
  risk: reversible
  note: trace step 2
- id: enter_note_name
  intent: "Enter {{note_name}} as the file name"
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    type:
      field:
        resource_id: new_file_dialog__name
        text: my_note
        hint: my_note
        kind: EditText
        cls: EditText
        siblings: [.md]
        in_list: false
        position: [0.346, 0.365]
      value: "{{note_name}}"
  post:
  - field_equals:
      field: {resource_id: new_file_dialog__name, text: my_note, kind: EditText}
      value: "{{note_name}}"
  risk: reversible
  note: trace step 3
- id: enter_file_extension
  intent: "Change the file extension to {{file_extension}}"
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    type:
      field:
        resource_id: new_file_dialog__ext
        text: .md
        hint: .md
        kind: EditText
        cls: EditText
        in_list: false
        position: [0.729, 0.365]
      value: "{{file_extension}}"
  post:
  - field_equals:
      field: {resource_id: new_file_dialog__ext, text: .md, kind: EditText}
      value: "{{file_extension}}"
  risk: reversible
  note: trace step 4
- id: confirm_file_creation
  intent: Tap 'OK' to confirm creation of the note
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      resource_id: button1
      text: OK
      kind: Button
      cls: Button
      siblings: [FOLDER, CANCEL]
      in_list: false
      position: [0.854, 0.598]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: toolbar
      text: "{{note_name}}"
      kind: Button
  - element_present: {resource_id: action_undo, text: Undo, kind: Button}
  risk: reversible
  note: trace step 5
- id: long_press_editor
  intent: Long-press in the empty note editor to open the text action menu
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    long_press:
      resource_id: document__fragment__edit__highlighting_editor
      text: ''
      kind: EditText
      cls: EditText
      parent: document__fragment__edit__content_editor__scrolling_parent
      in_list: false
      position: [0.5, 0.483]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: overflow, text: More options, kind: Button}
  risk: reversible
  note: trace step 6
- id: tap_paste
  intent: Tap 'Paste' to paste the clipboard content into the note
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      text: Paste
      kind: Button
      cls: LinearLayout
      in_list: false
      position: [0.116, 0.097]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: document__fragment__edit__highlighting_editor, kind: EditText}
  risk: reversible
  note: trace step 7
- id: tap_save
  intent: Tap 'Save' to save the note
  pre:
  - {app_foreground: net.gsantner.markor}
  action:
    tap:
      resource_id: action_save
      text: Save
      kind: Button
      cls: TextView
      siblings: [Undo, Redo, View mode]
      in_list: false
      position: [0.757, 0.084]
  post:
  - {screen_changed: true}
  risk: reversible
  extract:
    note_title:
      locator: {resource_id: toolbar, kind: Button}
      expect_digits: true
    pasted_content:
      locator: {resource_id: document__fragment__edit__highlighting_editor, kind: EditText}
  note: trace step 8
