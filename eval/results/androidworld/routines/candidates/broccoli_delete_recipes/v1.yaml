routine: broccoli_delete_recipes
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Delete recipes from the Broccoli app
description: Searches for three named recipes in Broccoli, deletes each one through its options menu, and then verifies that searches for the
  recipes return no results.
patterns: [Delete these recipes from Broccoli, Remove some recipes from Broccoli, Delete recipes I no longer need, Remove the named recipes from
    my collection]
start: fresh_launch
inputs:
  first_recipe_name: {type: text, description: The first recipe to delete., example: Chicken Alfredo Pasta}
  second_recipe_name: {type: text, description: The second recipe to delete., example: Tomato Basil Bruschetta}
  third_recipe_name: {type: text, description: The third recipe to delete., example: Grilled Cheese with Tomato and Basil}
