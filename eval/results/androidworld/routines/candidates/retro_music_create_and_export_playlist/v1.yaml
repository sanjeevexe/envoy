routine: retro_music_create_and_export_playlist
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Create a playlist in Retro Music and export it to Downloads
description: Creates a named playlist in Retro Music containing the requested songs in the specified order, then exports the playlist to the Downloads
  directory and verifies the exported file in Files. Only works when first_song is the one already shown on 'Chasing Shadows'. Only works when
  second_song is the one already shown on 'Lost in the Echo'. Only works when third_song is the one already shown on 'Twilight Calling'.
patterns: [Create a playlist in Retro Music and export it to Downloads, Make a new playlist with these songs in order and export it, Build a playlist
    and save the exported file to Downloads]
outputs: [exported_playlist_file]
start: fresh_launch
inputs:
  playlist_name: {type: text, description: Title of the new playlist., example: Blues Break 567}
  first_song: {type: text, description: Title of the first song in the playlist., example: Chasing Shadows}
  second_song: {type: text, description: Title of the second song in the playlist., example: Lost in the Echo}
  third_song: {type: text, description: Title of the third song in the playlist., example: Twilight Calling}
