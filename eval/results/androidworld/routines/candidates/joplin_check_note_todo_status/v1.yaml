routine: joplin_check_note_todo_status
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Check if a Joplin note is marked as a todo item
description: Open a note in Joplin by its title and inspect the Actions menu to determine whether the note is marked as a todo item, returning
  True or False.
patterns: [Is this note marked as a todo item in Joplin, Check if a Joplin note is a todo, Is the note a todo or a regular note]
outputs: [is_todo]
start: fresh_launch
inputs:
  note_title: {type: text, description: The title of the Joplin note to check., example: To-Do List}
steps:
- id: launch_joplin_app
  intent: Launch the Joplin app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: net.cozic.joplin}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: read
  note: trace step 1
- id: find_tap_note_by_title
  intent: "Scroll to {{note_title}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{note_title}}"
        kind: Button
        cls: ViewGroup
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{note_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: tap_note_by_title
  intent: "Tap the note titled {{note_title}}"
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text_has: "{{note_title}}"
      kind: Button
      cls: ViewGroup
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab-content, text: , kind: Text}
  - element_present: {resource_id: cross-fade-icon-current, text: , kind: Text}
  risk: reversible
  note: trace step 2
- id: tap_actions_menu
  intent: Tap Actions to check the note type
  pre:
  - {app_foreground: net.cozic.joplin}
  action:
    tap:
      text: Actions · 
      kind: Button
      cls: ViewGroup
      in_list: false
      position: [0.933, 0.082]
  post:
  - {screen_changed: true}
  risk: reversible
  extract:
    is_todo:
      locator: {text: Convert to note, kind: Button}
  note: trace step 3
