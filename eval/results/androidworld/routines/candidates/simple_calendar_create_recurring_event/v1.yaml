routine: simple_calendar_create_recurring_event
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Create a recurring calendar event in Simple Calendar Pro
description: Creates a weekly recurring event that repeats forever in Simple Calendar Pro using a supplied title, description, start date, start
  time, and end time.
patterns: [Create a recurring calendar event, Add a weekly event that repeats forever, Schedule a recurring event with a title and description,
  Create a repeating calendar appointment]
outputs: [event_title, event_start_time, event_end_time, repetition]
start: fresh_launch
inputs:
  event_title: {type: text, description: Title of the calendar event, example: Review session for Budget Planning}
  event_description: {type: text, description: Description of the calendar event, example: We will understand business objectives. Remember to
      confirm attendance.}
  event_start_time:
    type: text
    description: Start time of each event occurrence
    example: "14:00"
  event_end_time:
    type: text
    description: End time of each event occurrence
    example: "15:00"
  recurrence_frequency: {type: text, description: How often the event repeats, example: Weekly}
