routine: settings_set_brightness_minimum
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Set the Android display brightness to the minimum
description: Launches Settings, navigates to Display, opens the Brightness level control, and confirms the display brightness is at its minimum
  value.
patterns: [turn brightness to the minimum, set brightness to the lowest, dim the display all the way down, turn display brightness down to minimum]
outputs: [brightness_level]
start: fresh_launch
steps:
- id: open_settings
  intent: Launch Settings
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: com.android.settings}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: settings_homepage_container, kind: List}
  risk: read
  note: trace step 3
- id: scroll_to_display_settings
  intent: Scroll until the Display settings entry is visible
  pre:
  - {app_foreground: com.android.settings}
  action:
    scroll_until:
      target:
        text: Display · Dark theme, font size, brightness
        kind: Button
        cls: LinearLayout
        parent: recycler_view
        in_list: true
        position: [0.5, 0.341]
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text: Display · Dark theme, font size, brightness
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.341]
  risk: read
  note: trace step 4 (+1 scrolls)
- id: open_display_settings
  intent: Tap the Display settings entry
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Display · Dark theme, font size, brightness
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.341]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: content_parent, kind: List}
  risk: reversible
  note: trace step 5
- id: open_brightness_level
  intent: Tap the Brightness level setting to open the brightness control and verify it is at the minimum
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Brightness level
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.348]
  post:
  - {screen_changed: true}
  risk: reversible
  extract:
    brightness_level:
      near: Display brightness
      locator: {resource_id: content, kind: Text}
      segment: 1
      expect_digits: true
  note: trace step 6
