routine: simple_calendar_pro_get_event_titles
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Get the titles of events scheduled in Simple Calendar Pro at a specific date and time
description: Opens Simple Calendar Pro, navigates to the requested date, finds events starting at the requested time, and returns their titles
  only as a comma-separated list when there are multiple.
patterns: [what is on my schedule for a date at a time, what events do I have on a date at a time, check my calendar for events at a specific
    time]
outputs: [event_title]
start: fresh_launch
steps:
- id: open_simple_calendar_pro
  intent: Launch Simple Calendar Pro
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: com.simplemobiletools.calendar.pro}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: top_toolbar_search_icon, kind: Button}
  - element_present: {resource_id: top_toolbar_search, text: Search, kind: EditText}
  risk: read
  note: trace step 1
- id: navigate_to_schedule_date
  intent: "Navigate to {{schedule_date}} and view the events scheduled at {{schedule_time}}"
  pre:
  - {app_foreground: com.simplemobiletools.calendar.pro}
  action:
    tap:
      visual: the calendar cell for 27 in the October grid
      crop: 
      region: [0.714, 0.708, 0.86, 0.792]
      density: 420
  post:
  - {screen_changed: true}
  - element_present: {resource_id: go_to_today, text: Go to today, kind: Button}
  risk: reversible
  extract:
    event_title:
      locator: {resource_id: event_item_holder, kind: Button}
      segment: 0
  note: trace step 3
