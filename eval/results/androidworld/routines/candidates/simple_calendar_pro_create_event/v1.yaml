routine: simple_calendar_pro_create_event
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Create an event in Simple Calendar Pro
description: Creates a new event in Simple Calendar Pro with the given title, description, date, start time, and duration, saves it, then searches
  for the event to verify it was created.
patterns: [create a calendar event, add a new event to my calendar, schedule an event, create an event in Simple Calendar Pro]
outputs: [created_event_title, created_event_time_range, created_event_day]
start: fresh_launch
inputs:
  event_title: {type: text, description: Title of the calendar event to create, example: Call with the Team}
  event_description: {type: text, description: Description of the calendar event, example: We will understand upcoming project milestones.}
  event_date: {type: date, description: Date on which the event takes place, example: '2023-10-29'}
  event_start_time:
    type: text
    description: Time at which the event starts
    example: "13:00"
  event_end_time:
    type: text
    description: Time at which the event ends, derived from the start time plus the duration
    example: "14:00"
steps:
