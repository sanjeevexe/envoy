routine: contacts_create_contact
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Enter a new contact's details in Contacts without saving
description: Opens Contacts, starts a new contact, fills in the first name, last name, phone number, and phone label, and leaves the contact editor
  open without saving.
patterns: [add a new contact, create a new contact, enter a contact's details, fill in a new contact without saving]
start: fresh_launch
inputs:
  first_name: {type: text, description: The contact's first name, example: Grace}
  last_name: {type: text, description: The contact's last name, example: Taylor}
  phone_number: {type: text, description: The contact's phone number, example: 799-802-1530}
  phone_label: {type: text, description: The label for the phone number, example: Work}
steps:
- id: launch_contacts
  intent: Launch the Contacts app
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present:
      resource_id: "{{phone_label}}space"
      kind: List
  action: {launch: com.google.android.contacts}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: contacts, text: Contacts, kind: Text}
  - element_present: {resource_id: navigation_bar_item_labels_group, text: Contacts, kind: Text}
  risk: read
  note: trace step 1
- id: tap_create_contact
  intent: Tap "Create contact" to open the new contact screen
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    tap:
      resource_id: floating_action_button
      text: Create contact
      kind: Button
      cls: ImageButton
      parent: root
      in_list: false
      position: [0.874, 0.838]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: toolbar_button, text: Save, kind: Button}
  - element_present: {resource_id: contact_editor_scroller, kind: List}
  risk: reversible
  note: trace step 2
- id: enter_first_name
  intent: "Enter {{first_name}} in the \"First name\" field"
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    type:
      field:
        text: First name
        hint: First name
        kind: EditText
        cls: EditText
        in_list: true
        position: [0.495, 0.389]
      value: "{{first_name}}"
  post:
  - field_equals:
      field: {text: First name, kind: EditText}
      value: "{{first_name}}"
  risk: reversible
  note: trace step 3
- id: enter_last_name
  intent: "Enter {{last_name}} in the \"Last name\" field"
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    type:
      field:
        text: Last name
        hint: Last name
        kind: EditText
        cls: EditText
        in_list: true
        position: [0.495, 0.466]
      value: "{{last_name}}"
  post:
  - field_equals:
      field: {text: Last name, kind: EditText}
      value: "{{last_name}}"
  risk: reversible
  note: trace step 4
- id: enter_phone_number
  intent: "Enter {{phone_number}} in the \"Phone\" field"
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    type:
      field:
        text: Phone
        hint: Phone
        kind: EditText
        cls: EditText
        in_list: true
        position: [0.495, 0.637]
      value: "{{phone_number}}"
  post:
  - field_equals:
      field: {text: Phone, kind: EditText}
      value: "{{phone_number}}"
  risk: reversible
  note: trace step 5
- id: tap_phone_label_dropdown
  intent: Tap the current phone label to open the phone label options
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    tap:
      text: Mobile
      desc: Mobile Phone
      hint: Label
      kind: Button
      cls: Spinner
      in_list: true
      position: [0.335, 0.714]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 8
- id: find_select_phone_label
  intent: "Scroll to {{phone_label}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: text1
        text_has: "{{phone_label}}"
        kind: Toggle
        cls: CheckedTextView
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: text1
      text_has: "{{phone_label}}"
      kind: Toggle
      cls: CheckedTextView
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: select_phone_label
  intent: "Select {{phone_label}} as the phone label"
  pre:
  - {app_foreground: com.google.android.contacts}
  action:
    tap:
      resource_id: text1
      text_has: "{{phone_label}}"
      kind: Toggle
      cls: CheckedTextView
      in_list: true
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 9
done:
- text_visible: "{{phone_label}}"
