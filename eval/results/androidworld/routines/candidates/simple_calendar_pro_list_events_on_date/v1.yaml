routine: simple_calendar_pro_list_events_on_date
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Check for events on a date in Simple Calendar Pro
description: Opens Simple Calendar Pro, selects the requested date in the calendar view, and returns the titles of the events scheduled for that
  day as a comma-separated list.
patterns: [Do I have any events on a date, What events do I have on a day, List event titles for a date in Simple Calendar Pro, Check my calendar
    for a date]
start: fresh_launch
steps:
- id: launch_simple_calendar_pro
  intent: Launch Simple Calendar Pro
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: com.simplemobiletools.calendar.pro}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: top_toolbar_search_icon, kind: Button}
  - element_present: {resource_id: top_toolbar_search, text: Search, kind: EditText}
  risk: read
  note: trace step 2
- id: open_target_date
  intent: "Tap {{target_date}} in the calendar to open the events for that date"
  pre:
  - {app_foreground: com.simplemobiletools.calendar.pro}
  action:
    tap:
      visual: date cell 28 in the October month grid
      crop: 
      region: [0.855, 0.72, 0.999, 0.835]
      density: 420
  post:
  - {screen_changed: true}
  - element_present: {resource_id: go_to_today, text: Go to today, kind: Button}
  risk: reversible
  note: trace step 5
