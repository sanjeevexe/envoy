routine: broccoli_add_recipes_from_image
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Add the recipes from an image in Simple Gallery Pro to the Broccoli recipe app
description: "Open an image containing recipes in Simple Gallery Pro, then create each pictured recipe in Broccoli by filling in its title, description,\
  \ servings, preparation time, ingredients, and directions, and verify the new recipes in the Recipes list. Only works when recipe_3_description\
  \ is the one already shown on 'Recipe photo'. Only works when recipe_3_servings is the one already shown on 'Servings: 2 servings'."
patterns: [Add the recipes from this image to Broccoli, Import the recipes in this photo into Broccoli, Put the recipes from my gallery image
    in my recipe app]
outputs: [added_recipe_2_title, added_recipe_3_title, added_recipe_1_title]
start: fresh_launch
inputs:
  image_filename: {type: text, description: Image file to open in Simple Gallery Pro containing the recipes to add., example: recipes.jpg}
  recipe_1_title: {type: text, description: Title of the first recipe from the image., example: Eggplant Parmesan}
  recipe_1_description: {type: text, description: Description of the first recipe from the image., example: An ideal recipe for experimenting
      with different flavors and ingredients.}
  recipe_1_servings: {type: text, description: Servings for the first recipe from the image., example: 8 servings}
  recipe_1_preparation_time: {type: text, description: Preparation time for the first recipe from the image., example: 10 mins}
  recipe_1_ingredients: {type: text, description: Ingredients for the first recipe from the image., example: varies}
  recipe_1_directions: {type: text, description: Directions for the first recipe from the image., example: 'Slice eggplant, bread, and fry. Layer
      in a baking dish with marinara sauce and mozzarella cheese. Bake until bubbly. Garnish with fresh herbs for a more vibrant taste.'}
  recipe_2_title: {type: text, description: Title of the second recipe from the image., example: Baked Cod with Lemon and Dill}
  recipe_2_description: {type: text, description: Description of the second recipe from the image., example: 'A quick and easy meal, perfect for
      busy weekdays.'}
  recipe_2_servings: {type: text, description: Servings for the second recipe from the image., example: 2 servings}
  recipe_2_preparation_time: {type: text, description: Preparation time for the second recipe from the image., example: 45 mins}
  recipe_2_ingredients: {type: text, description: Ingredients for the second recipe from the image., example: subject to change}
  recipe_2_directions: {type: text, description: Directions for the second recipe from the image., example: 'Place cod fillets in a baking dish,
      season with lemon juice, dill, salt, and pepper. Bake until fish flakes easily. Garnish with fresh herbs for a more vibrant taste.'}
  recipe_3_title: {type: text, description: Title of the third recipe from the image., example: Chickpea Vegetable Soup}
  recipe_3_description: {type: text, description: Description of the third recipe from the image., example: An ideal recipe for experimenting
      with different flavors and ingredients.}
  recipe_3_servings: {type: text, description: Servings for the third recipe from the image., example: 2 servings}
  recipe_3_preparation_time: {type: text, description: Preparation time for the third recipe from the image., example: 2 hrs}
  recipe_3_ingredients: {type: text, description: Ingredients for the third recipe from the image., example: as desired}
  recipe_3_directions: {type: text, description: Directions for the third recipe from the image., example: 'Saute onions, carrots, and celery,
      add broth, canned tomatoes, and chickpeas. Simmer with spinach and seasonings. Try adding a pinch of your favorite spices for extra flavor.'}
steps:
- id: launch_simple_gallery_pro
  intent: Launch Simple Gallery Pro
  pre:
  - {app_foreground: com.google.android.apps.nexuslauncher}
  - element_present: {resource_id: workspace, kind: List}
  action: {launch: com.simplemobiletools.gallery.pro}
  post:
  - {screen_changed: true}
  - element_present: {resource_id: directories_coordinator, kind: List}
  risk: read
  note: trace step 1
- id: open_dcim_folder
  intent: Open the DCIM folder to find the image
  pre:
  - {app_foreground: com.simplemobiletools.gallery.pro}
  action:
    tap:
      resource_id: dir_holder
      text: DCIM
      kind: Button
      cls: RelativeLayout
      parent: directories_grid
      in_list: true
      position: [0.25, 0.236]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: media_coordinator, kind: List}
  risk: reversible
  note: trace step 2
- id: find_open_recipe_image
  intent: "Scroll to {{image_filename}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: media_item_holder
        text_has: "{{image_filename}}"
        kind: Button
        cls: RelativeLayout
        parent: media_grid
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: media_item_holder
      text_has: "{{image_filename}}"
      kind: Button
      cls: RelativeLayout
      parent: media_grid
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_recipe_image
