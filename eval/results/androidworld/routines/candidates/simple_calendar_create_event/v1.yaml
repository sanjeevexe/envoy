routine: simple_calendar_create_event
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Create an event in Simple Calendar Pro
description: Creates a new event in Simple Calendar Pro with a supplied title, description, date, start time and end time, then verifies the saved
  event on the selected day.
patterns: [Create a calendar event, Add a new event to my calendar, Schedule an event, Create an event in Simple Calendar Pro, Add a meeting to
    my calendar]
outputs: [event_date, event_time]
start: fresh_launch
inputs:
  event_title: {type: text, description: Title of the calendar event., example: Meeting with the Team}
  event_description: {type: text, description: Description of the calendar event., example: We will prepare for annual budget.}
  event_date: {type: date, description: 'Date on which the event starts, selected in the date picker.', example: October 29}
  event_start_time:
    type: text
    description: Time at which the event starts.
    example: "17:00"
  event_end_time:
    type: text
    description: Time at which the event ends.
    example: "17:30"
