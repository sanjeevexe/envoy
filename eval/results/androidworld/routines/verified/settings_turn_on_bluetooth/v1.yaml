routine: settings_turn_on_bluetooth
app: com.google.android.apps.nexuslauncher
version: 1
status: active
intent: Turn on Bluetooth in Settings
description: Open Settings, navigate through Connected devices and Connection preferences to the Bluetooth screen, and confirm that Bluetooth
  is turned on.
patterns: [turn bluetooth on, enable bluetooth, turn on bluetooth, switch bluetooth on]
outputs: [bluetooth_enabled]
start: fresh_launch
steps:
