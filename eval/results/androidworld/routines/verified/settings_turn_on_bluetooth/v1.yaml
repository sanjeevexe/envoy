  - {screen_changed: true}
  risk: reversible
  note: trace step 6
- id: open_bluetooth
  intent: Tap Bluetooth to open the Bluetooth settings and confirm it is turned on
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Bluetooth
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.328]
