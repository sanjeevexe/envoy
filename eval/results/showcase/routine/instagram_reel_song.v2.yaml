routine: instagram_reel_song
app: com.instagram.android
version: 1
status: draft
intent: Post a gallery video to Instagram as a reel
description: Posts the newest video from the phone's gallery to Instagram as a reel, adds a selected track from Instagram's music library, and
  enters a caption before the final share step.
patterns: [post my newest video as a reel, share my latest gallery video to Instagram, make an Instagram reel from my newest video, post a video
    to Instagram with music and a caption]
start: fresh_launch
inputs:
  song_title: {type: text, description: Search term and title of the song to add from Instagram's music library., example: golden hour}
  song_artist: {type: text, description: Artist of the song to add., example: JVKE}
  caption:
    type: text
    description: Caption to enter for the reel.
    example: "Envoy rehearsal: one clip, three apps"
