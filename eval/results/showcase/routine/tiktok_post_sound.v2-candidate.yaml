routine: tiktok_post_sound
app: com.zhiliaoapp.musically
version: 1
status: draft
intent: Post the newest gallery video to TikTok with a chosen sound and caption
description: Opens TikTok, creates a post from the newest video in the phone gallery, searches TikTok's sound library for the requested sound
  and applies it, then adds the requested caption and dismisses the keyboard for review.
patterns: [Post my newest video to TikTok with a sound and caption, Create a TikTok from my latest gallery clip, Upload my newest phone video
    to TikTok, Make a TikTok post from my most recent video]
start: fresh_launch
