routine: youtube_music_search_song_artist
app: com.google.android.apps.youtube.music
version: 1
status: draft
intent: Search for a song in YouTube Music and identify the artist of the first song result
description: Searches YouTube Music for a requested song, filters the results to songs, and returns the artist shown for the first song result.
patterns: [search for a song and tell me the artist, find a song in YouTube Music and tell me who the artist is, who is the artist of the first
    song result for a song, look up a song and tell me its artist]
outputs: [artist]
start: fresh_launch
inputs:
  song_name: {type: text, description: The song title to search for., example: Blinding Lights}
steps:
- id: tap_search
  intent: Tap Search to start searching
  pre:
  - {app_foreground: com.google.android.apps.youtube.music}
  - element_present: {resource_id: watch_fragment_container, text: Video player, kind: Text}
  action:
    tap:
      text: Search
      kind: Button
      cls: LinearLayout
      in_list: false
      position: [0.5, 0.948]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: search_edit_text, text: Type to search, kind: EditText}
  - element_present: {resource_id: toolbar_back_navigation, text: Search back, kind: Button}
  risk: reversible
  note: trace step 1
- id: enter_song_name
  intent: "Type {{song_name}} into the search field and submit"
  pre:
  - {app_foreground: com.google.android.apps.youtube.music}
  action:
    type:
      field:
        resource_id: search_edit_text
        text: Type to search
        hint: Type to search
        kind: EditText
        cls: EditText
        parent: search_toolbar_layout
        siblings: [Voice search]
        in_list: false
        position: [0.432, 0.084]
      value: "{{song_name}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: search_edit_text
      text: "Search songs, artists, podcasts: {{song_name}}"
      kind: EditText
  - element_present: {resource_id: text1, text: Search, kind: Text}
  risk: reversible
  note: trace step 2
- id: filter_by_songs
  intent: Tap Songs to show only song results
  pre:
  - {app_foreground: com.google.android.apps.youtube.music}
  action:
    tap:
      resource_id: chip_contents
      text: Songs
      kind: Text
      cls: LinearLayout
      parent: Show song results
      in_list: true
      position: [0.111, 0.145]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: search_clear_button, text: Clear filters, kind: Button}
  risk: reversible
  extract:
    artist:
      locator:
        resource_id: two_column_item_content_parent
        text_has: "{{song_name}}"
        in_list: true
      segment: 1
  note: trace step 3
