routine: starbucks_get_item_calories
app: com.starbucks.mobilecard
version: 1
status: draft
intent: Look up the calories for a Starbucks menu item in a chosen size
description: Open the Starbucks menu without selecting a café, search for a menu item, open its product page for the requested size, and read
  the calorie count shown there. Only works when size is the one already shown on 'Grande Caffè Latte'.
patterns: [how many calories are in a menu item, what is the calorie count for a drink, check the calories for an item and size]
outputs: [calories]
start: fresh_launch
inputs:
  drink_name: {type: text, description: Menu item to look up, example: Caffè Latte}
  size: {type: text, description: Requested size of the menu item, example: Grande}
steps:
- id: open_order
  intent: Tap Order to open the menu
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Order
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: button2, text: 'No, thanks', kind: Button}
  - element_present: {resource_id: button1, text: Share location, kind: Button}
  risk: reversible
  note: trace step 1
- id: dismiss_location_prompt
  intent: Dismiss the location prompt
  optional: true
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      resource_id: button2
      text: No, thanks
      kind: Button
      cls: Button
      siblings: [Share location]
      in_list: false
      position: [0.313, 0.63]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: stores_tab_empty_state_title, text: No cafés found, kind: Text}
  - element_present: {resource_id: stores_tab_empty_state_body, text: 'Try searching another area, removing filters, or zooming in or out to get
        a better look.', kind: Text}
  risk: reversible
  note: "trace step 2 · one-time screen: optional"
- id: skip_store_selection
  intent: Skip selecting a café so the menu can be browsed
  optional: true
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Skip
      kind: Button
      cls: View
      siblings: [Search]
      in_list: false
      position: [0.923, 0.057]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: button2, text: Choose a café, kind: Button}
  - element_present: {resource_id: button1, text: 'Yes', kind: Button}
  risk: reversible
  note: "trace step 3 · one-time screen: optional"
- id: confirm_skip_to_menu
  intent: Confirm skipping directly to the menu
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      resource_id: button1
      text: 'Yes'
      kind: Button
      cls: Button
      siblings: [Choose a café]
      in_list: false
      position: [0.737, 0.581]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: button2, text: Choose a café, kind: Button}
  risk: reversible
  note: trace step 4
- id: open_search_menu
  intent: "Open menu search to find {{drink_name}}"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text: Search Menu
      kind: Button
      cls: Button
      in_list: true
      position: [0.941, 0.052]
  post:
  - {screen_changed: true}
  - element_present:
      text: "{{drink_name}}"
      kind: Button
  - element_present:
      text: "{{size}} {{drink_name}}"
      kind: Button
  risk: reversible
  note: trace step 5
- id: select_search_suggestion
  intent: "Tap the {{drink_name}} search suggestion"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  - element_present:
      text_has: "{{size}}"
      kind: Button
  action:
    tap:
      text_has: "{{drink_name}}"
      kind: Button
      cls: LinearLayout
      in_list: false
  post:
  - {screen_changed: true}
  - element_present:
      text: "Search Menu: {{drink_name}}"
      kind: EditText
  risk: reversible
  note: trace step 6
- id: find_open_menu_item
  intent: "Scroll to {{drink_name}} if it is not on screen"
  action:
    scroll_until:
      target:
        text_has: "{{drink_name}}"
        kind: Button
        cls: RelativeLayout
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      text_has: "{{drink_name}}"
      kind: Button
      cls: RelativeLayout
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_menu_item
  intent: "Tap the {{drink_name}} result to open its product page and read the calories for the {{size}} size"
  pre:
  - {app_foreground: com.starbucks.mobilecard}
  action:
    tap:
      text_has: "{{drink_name}}"
      kind: Button
      cls: RelativeLayout
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      text: "{{size}} {{drink_name}}. Add to order"
      kind: Button
  risk: reversible
  extract:
    calories:
      near: "{{drink_name}}"
      next_element: true
      expect_digits: true
  note: trace step 7
