routine: settings_check_bluetooth_status
app: com.android.settings
version: 1
status: draft
intent: Check whether Bluetooth is turned on in the Settings app
description: Opens Settings, navigates through Connected devices and Connection preferences to the Bluetooth page, and reports the state of the
  Use Bluetooth switch.
patterns: [is bluetooth on, is bluetooth turned on or off, check bluetooth status, bluetooth on or off]
outputs: [bluetooth_status]
start: fresh_launch
steps:
- id: tap_connected_devices
  intent: Tap Connected devices to reach connectivity settings
  pre:
  - {app_foreground: com.android.settings}
  - element_present: {resource_id: settings_homepage_c*tainer, kind: List}
  action:
    tap:
      text: Connected devices · Bluetooth, pairing
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.465]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: c*tent_parent, kind: List}
  risk: reversible
  note: trace step 1
- id: tap_connection_preferences
  intent: Tap Connection preferences to reach Bluetooth settings
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Connection preferences · Bluetooth, Android Auto
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.45]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 2
- id: tap_bluetooth
  intent: Tap Bluetooth to open its settings page and check the switch
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: Bluetooth
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.301]
  post:
  - {screen_changed: true}
  risk: reversible
  extract:
    bluetooth_status:
      near: When Bluetooth is turned
      locator: {resource_id: title, kind: Text}
      after: ', your device can communicate with other nearby Bluetooth devices'
  note: trace step 3
