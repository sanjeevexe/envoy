routine: settings_get_android_version
app: com.android.settings
version: 1
status: draft
intent: Find what Android version this phone is running in Settings
description: Open the About device section in the Settings app and read the Android version listed there.
patterns: [what Android version is this phone running, check the Android version, what Android version do I have]
outputs: [android_version]
start: fresh_launch
steps:
- id: scroll_to_about_device
  intent: Scroll down in Settings until the About device entry is visible
  pre:
  - {app_foreground: com.android.settings}
  - element_present: {resource_id: settings_homepage_container, kind: List}
  action:
    scroll_until:
      target:
        text: About emulated device
        kind: Button
        cls: LinearLayout
        parent: recycler_view
        in_list: true
        position: [0.5, 0.84]
      direction: down
      max_scrolls: 8
      container: {resource_id: settings_homepage_container, kind: List}
  post:
  - element_present:
      text: About emulated device
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.84]
  risk: read
  note: trace step 1 (+2 scrolls)
- id: tap_about_device
  intent: Tap the About device entry to open device information
  pre:
  - {app_foreground: com.android.settings}
  action:
    tap:
      text: About emulated device
      kind: Button
      cls: LinearLayout
      parent: recycler_view
      in_list: true
      position: [0.5, 0.84]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: content_parent, kind: List}
  risk: reversible
  note: trace step 3
- id: scroll_to_android_version
  intent: Scroll down to reveal the Android version entry
  pre:
  - {app_foreground: com.android.settings}
  action:
    scroll_until:
      target: {text: Android version}
      direction: down
      max_scrolls: 8
      container: {resource_id: recycler_view, kind: List}
  post:
  - element_present: {text: Android version}
  risk: read
  extract:
    android_version: {near: Android version, segment: 1, expect_digits: true}
  note: trace step 4 (+1 scrolls)
