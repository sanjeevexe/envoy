routine: chipotle_find_menu_item_price
app: com.chipotle.ordering
version: 1
status: draft
intent: Find the price of a Chipotle menu item
description: Finds the price of a Chipotle menu item at the preferred pickup location and returns the price shown in the menu.
patterns: [find the price of a menu item, how much does a menu item cost, check a Chipotle menu price, what is the price of this item]
outputs: [price]
start: fresh_launch
inputs:
  menu_item: {type: text, description: Menu item whose price should be found., example: Chips & Guacamole}
  preferred_zip_code: {type: text, description: ZIP code for the preferred Chipotle pickup location., from_memory: preferred_location.zip_code,
    example: '10001'}
steps:
- id: open_menu_tab
  intent: Open the MENU tab
  pre:
  - {app_foreground: com.chipotle.ordering}
  - element_present: {resource_id: tab_item_container, text: HOME, kind: Text}
  action:
    tap:
      resource_id: menuFragment
      text: MENU
      kind: Button
      cls: FrameLayout
      in_list: false
      position: [0.278, 0.941]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: btn_group_order, text: GROUP, kind: Button}
  - element_present: {resource_id: rv_menu, kind: List}
  risk: reversible
  note: trace step 1
- id: scroll_to_chips_and_sides
  intent: Scroll until the CHIPS & SIDES category is visible
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    scroll_until:
      target:
        resource_id: view_container
        text: CHIPS & SIDES
        kind: Button
        cls: ViewGroup
        parent: rv_menu
        in_list: true
        position: [0.5, 0.66]
      direction: down
      max_scrolls: 8
      container: {resource_id: rv_menu, kind: List}
  post:
  - element_present:
      resource_id: view_container
      text: CHIPS & SIDES
      kind: Button
      cls: ViewGroup
      parent: rv_menu
      in_list: true
      position: [0.5, 0.66]
  risk: read
  note: trace step 3 (+1 scrolls)
- id: open_chips_and_sides
  intent: "Open the CHIPS & SIDES category containing {{menu_item}}"
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: view_container
      text: CHIPS & SIDES
      kind: Button
      cls: ViewGroup
      parent: rv_menu
      in_list: true
      position: [0.5, 0.66]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 4
- id: dismiss_location_dialog
  intent: Dismiss the location-data dialog blocking the menu
  optional: true
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: md_button_positive
      text: OKAY
      kind: Button
      cls: Button
      parent: md_button_layout
      in_list: false
      position: [0.825, 0.57]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: map, kind: Button}
  - element_present: {resource_id: view_tabs_bottom_sheet, kind: Button}
  risk: reversible
  note: "trace step 5 · one-time screen: optional"
- id: tap_location_search
  intent: Tap the location search field
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: view_search_input
      text: City, State, or ZIP
      hint: City, State, or ZIP
      kind: EditText
      cls: EditText
      parent: view_search_container
      in_list: false
      position: [0.541, 0.083]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: btn_segment_left, text: PICKUP, kind: Button}
  risk: reversible
  note: trace step 6
- id: enter_preferred_zip_code
  intent: "Type {{preferred_zip_code}} into the location search field"
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    type:
      field:
        resource_id: view_search_input
        text: City, State, or ZIP
        hint: City, State, or ZIP
        kind: EditText
        cls: EditText
        parent: view_search_container
        in_list: false
        position: [0.546, 0.083]
      value: "{{preferred_zip_code}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: btn_segment_left, text: PICKUP, kind: Button}
  risk: reversible
  note: trace step 7
- id: reveal_location_list
  intent: "Swipe to reveal the list of pickup locations for {{preferred_zip_code}}"
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    swipe:
      from:
        resource_id: btn_segment_left
        text: PICKUP
        kind: Button
        cls: Button
        siblings: [DELIVERY]
        in_list: false
        position: [0.369, 0.936]
      vector: [0.0, -0.52]
      start: [0.5, 0.92]
      grip: [0.996, 0.118]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: vp_pager, kind: List}
  - element_present:
      resource_id: view_section_header
      text: "{{preferred_zip_code}}"
      kind: Text
  risk: read
  note: trace step 9
- id: select_pickup_location
  intent: "Tap a pickup location shown for {{preferred_zip_code}}"
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: view_container
      kind: Button
      cls: ViewGroup
      parent: rv_pick_up_list
      in_list: true
      position: [0.5, 0.302]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: fab_peek_back, kind: Button}
  - element_present:
      resource_id: card_restaurant_details
      text: CURRENTLY CLOSED
      text_has: "{{preferred_zip_code}}"
      kind: Button
  risk: reversible
  note: trace step 10
- id: confirm_pickup_location
  intent: Tap PICK UP HERE to select the pickup location and proceed to the menu
  pre:
  - {app_foreground: com.chipotle.ordering}
  action:
    tap:
      resource_id: btn_select_restaurant
      text: PICK UP HERE
      kind: Button
      cls: Button
      siblings: [CURRENTLY CLOSED, Pickup]
      in_list: false
      position: [0.5, 0.882]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: tv_title, text: PICKING UP FROM, kind: Text}
  - element_present: {resource_id: view_coordinator, kind: List}
  risk: reversible
  extract:
    price:
      locator: {resource_id: tv_price, kind: Text}
      expect_digits: true
      card: "{{menu_item}}"
  note: trace step 11
