routine: chipotle_find_menu_item_price
app: com.chipotle.ordering
version: 1
status: draft
intent: Find the price of a menu item in the Chipotle app.
description: Sets the preferred pickup location by ZIP code, navigates to the menu category containing the requested item, opens the item, and
  returns its displayed price.
patterns: [find the price of a menu item, how much does a menu item cost, check the price of this item, what is the price of that side]
outputs: [price]
start: fresh_launch
inputs:
