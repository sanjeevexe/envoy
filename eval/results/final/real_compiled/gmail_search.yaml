routine: gmail_search_first_result_subject
app: com.google.android.gm
version: 1
status: draft
intent: Search Gmail and get the subject of the first result
description: Searches Gmail for a user-provided term, opens the first matching email, and returns its subject line from the opened conversation.
patterns: [search my mail for something and tell me the first subject, find emails about a topic in Gmail, what is the subject of the first email
    matching a search, search Gmail for a sender or keyword]
outputs: [subject]
start: fresh_launch
inputs:
  search_term: {type: text, description: The term to search for in Gmail., example: DoorDash}
steps:
- id: tap_search_field
  intent: Tap the Search in mail field
  pre:
  - {app_foreground: com.google.android.gm}
  - element_present: {resource_id: compose_button, text: Compose, kind: Button}
  action:
    tap:
      resource_id: open_search
      text: Search in mail
      hint: Search in mail
      kind: EditText
      cls: EditText
      parent: toolbar_wrapped_around_search_bar
      siblings: [Open navigation drawer]
      in_list: true
      position: [0.496, 0.088]
  post:
  - {screen_changed: true}
  - element_absent: {resource_id: compose_button, text: Compose, kind: Button}
  risk: reversible
  note: trace step 1
- id: type_search_term
  intent: "Type {{search_term}} into the Search in mail field and submit the search"
  pre:
  - {app_foreground: com.google.android.gm}
  action:
    type:
      field:
        resource_id: open_search_view_edit_text
        text: Search in mail
        hint: Search in mail
        kind: EditText
        cls: EditText
        parent: open_search_view_text_container
        in_list: true
        position: [0.519, 0.088]
      value: "{{search_term}}"
      submit: true
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 2
- id: open_first_result
  intent: Tap the first result in the search results list
  pre:
  - {app_foreground: com.google.android.gm}
  action:
    tap:
      kind: Button
      cls: FrameLayout
      parent: thread_list_view
      in_list: true
      position: [0.5, 0.299]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: item_pager, kind: List}
  - element_present: {resource_id: archive, text: Archive, kind: Button}
  risk: reversible
  extract:
    subject:
      locator: {resource_id: subject_and_folder_view, kind: Button}
      after: Inbox
  note: trace step 3
