routine: google_maps_get_place_address
app: com.google.android.apps.maps
version: 1
status: draft
intent: Find the street address of a place in Google Maps
description: Search for a named place in Google Maps, open its details, scroll to reveal its address, and return the street address.
patterns: [Tell me the street address of a place, What is the address of this place, Find a place's address in Maps, Look up an address for a
    place]
outputs: [street_address]
start: fresh_launch
inputs:
  place_name: {type: text, description: The name of the place to search for, example: Empire State Building}
steps:
- id: search_place
  intent: "Type {{place_name}} into the search box"
  pre:
  - {app_foreground: com.google.android.apps.maps}
  - element_present: {resource_id: explore_tab_strip_button, text: Explore, kind: Text}
  action:
    type:
      field:
        resource_id: search_omnibox_text_box
        text: Search here
        hint: Search here
        kind: EditText
        cls: EditText
        parent: mod_search_omnibox_layout
        in_list: false
        position: [0.38, 0.061]
      value: "{{place_name}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: search_omnibox_text_box
      text: "{{place_name}}"
      kind: EditText
  - element_present:
      resource_id: street_view_thumbnail
      text: "View Street view imagery for {{place_name}}"
      kind: Button
  risk: reversible
  note: trace step 1
- id: scroll_to_address
  intent: Scroll down through the place details to reveal the address
  pre:
  - {app_foreground: com.google.android.apps.maps}
  action:
    scroll_until:
      target:
        text: "Address:"
      direction: down
      max_scrolls: 8
      container: {resource_id: expandingscrollview_container, kind: List}
  post:
  - element_present:
      text: "Address:"
  risk: read
  extract:
    street_address:
      near: "Address:"
  note: trace step 2 (+2 scrolls)
compiled_from:
  task_id: f7-1103034419-real-maps_address
  goal: In Google Maps, search for the Empire State Building and tell me its street address.
  compiler: muse-wonder-1.0
  compiled_at: "2026-11-03 03:57:02"
  trace_steps_kept: [1, 2]
  trace_steps_dropped: 0
  cost_usd: 0.0455
