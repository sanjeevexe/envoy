routine: amazon_search_first_result_price
app: com.amazon.mShop.android.shopping
version: 1
status: draft
intent: Search for a product in Amazon and report the price of the first result
description: Searches Amazon for the requested product and returns the price shown for the first search result.
patterns: [search Amazon and tell me the price of the first result, look up a product on Amazon and report the first price, find this on Amazon
    and tell me how much the first result costs]
outputs: [first_result_price]
start: fresh_launch
inputs:
  search_query: {type: text, description: The product to search for on Amazon., example: AA batteries}
steps:
- id: tap_search
  intent: Tap Search to open the Amazon search field
  pre:
  - {app_foreground: com.amazon.mShop.android.shopping}
  - element_present: {resource_id: chrome_search_hint_view, text: Search Amazon, kind: Text}
  action:
    tap:
      resource_id: chrome_search_box
      text: Search
      kind: Button
      cls: ImageButton
      in_list: false
      position: [0.5, 0.059]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: rs_search_entry_bar, text: Search Amazon, kind: Button}
  - element_present: {resource_id: rs_search_src_text, text: Search Amazon, kind: EditText}
  risk: reversible
  note: trace step 1
- id: type_search_query
  intent: "Type {{search_query}} into the Search Amazon field and submit the search"
  pre:
  - {app_foreground: com.amazon.mShop.android.shopping}
  action:
    type:
      field:
        resource_id: rs_search_src_text
        text: Search Amazon
        hint: Search Amazon
        kind: EditText
        cls: EditText
        parent: search_edit_frame
        in_list: false
        position: [0.593, 0.059]
      value: "{{search_query}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: chrome_search_hint_view
      text: "{{search_query}}"
      kind: Text
  - element_present: {resource_id: chrome_search_box, text: Search, kind: Button}
  risk: reversible
  extract:
    first_result_price:
      pattern: "(?P<v>\\$\\d+\\.\\d+)\\s*\\(\\ \\$\\d+\\.\\d+\\ /count\\)\\ List:\\ \\$\\d+\\.\\d+"
      first_in_list: true
      expect_digits: true
  note: trace step 2
compiled_from:
  task_id: f7-1103034419-real-amazon
  goal: In the Amazon app, search for AA batteries and tell me the price of the first result.
  compiler: muse-wonder-1.0
  compiled_at: "2026-11-03 03:45:31"
