routine: doordash_search_first_restaurant
app: com.dd.doordash
version: 1
status: draft
intent: Search DoorDash for a food and report the first restaurant in the results
description: Open search in the DoorDash app, search for the requested food or query, and return the name of the first restaurant shown in the
  results list.
patterns: [search for food and tell me the first restaurant, find the top restaurant in DoorDash, search DoorDash and name the first result, what
    is the first restaurant for this food]
outputs: [first_restaurant_name]
start: fresh_launch
inputs:
  search_query: {type: text, description: The food or search term to look up in DoorDash., example: pizza}
steps:
- id: tap_search_doordash
  intent: Tap the Search DoorDash field to start a search
  pre:
  - {app_foreground: com.dd.doordash}
  - element_present: {resource_id: coordinatorLayout_homepage, kind: List}
  action:
    tap:
      text: Search DoorDash
      kind: Button
      cls: View
      in_list: false
      position: [0.49, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: edit_text, text: Search DoorDash, kind: EditText}
  - element_present: {resource_id: search_back_button, text: Close search, kind: Button}
  risk: reversible
  note: trace step 1
- id: type_search_query
  intent: "Type {{search_query}} into the Search DoorDash field and submit the search"
  pre:
  - {app_foreground: com.dd.doordash}
  action:
    type:
      field:
        resource_id: edit_text
        text: Search DoorDash
        hint: Search DoorDash
        kind: EditText
        cls: AutoCompleteTextView
        in_list: false
        position: [0.573, 0.079]
      value: "{{search_query}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: search_query_title
      text: "{{search_query}}"
      kind: Button
  risk: reversible
  extract:
    first_restaurant_name:
      pattern: "(?P<v>[^,]+?),\\s*\\d+(?:\\.\\d+)?\\ mi\\ away(?:,.*)?"
      first_in_list: true
  note: trace step 2
