routine: play_store_get_app_star_rating
app: com.android.vending
version: 1
status: draft
intent: Look up an app's star rating in the Google Play Store
description: Searches the Google Play Store for a named app and reads the average star rating shown on its listing, without installing the app
  or signing in.
patterns: [what is the star rating of an app, how many stars does an app have, check an app's Play Store rating, what rating does an app have
    on Google Play]
outputs: [star_rating]
start: fresh_launch
inputs:
  app_name: {type: text, description: The app to look up, example: Duolingo}
steps:
- id: tap_search
  intent: Tap Search to start looking up an app
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Search
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.939]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 1
- id: tap_search_field
  intent: Tap the search field
  pre:
  - {app_foreground: com.android.vending}
  action:
    tap:
      text: Search or ask Play
      kind: Button
      cls: View
      in_list: false
      position: [0.514, 0.084]
  post:
  - {screen_changed: true}
  risk: reversible
  note: trace step 2
- id: type_app_name
  intent: "Type {{app_name}} and submit the search"
  pre:
  - {app_foreground: com.android.vending}
  action:
    type:
      field:
        text: Search apps & games
        hint: Search apps & games
        kind: EditText
        cls: EditText
        in_list: false
        position: [0.5, 0.084]
      value: "{{app_name}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      text: "{{app_name}}"
      kind: Button
  risk: reversible
  extract:
    star_rating:
      near: Average rating
      expect_digits: true
      card: "{{app_name}}"
  note: trace step 3
