routine: skylark_look_up_trip
app: com.skylark.air
version: 1
status: active
intent: Look up a SkyLark flight trip
description: Look up a SkyLark trip using a confirmation code and last name, open the matching trip row, and report where the trip goes.
patterns: [look up my trip, where does my trip go, find my trip with my confirmation code, tell me where my trip goes]
outputs: [destination]
start: fresh_launch
inputs:
  trip_confirmation_code: {type: text, description: Confirmation code for the trip to look up, example: PT4R8Z}
  user_last_name: {type: text, description: Last name on the booking, from_memory: user.last_name, example: Patel}
steps:
- id: tap_my_trips
  intent: Tap My Trips
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: enter_confirmation_code
  intent: "Enter {{trip_confirmation_code}} into the Confirmation code field"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    type:
      field:
        resource_id: field_confirmation
        text: Confirmation code
        hint: Confirmation code
        kind: EditText
        cls: EditText
        siblings: [Find a trip]
        in_list: true
        position: [0.5, 0.228]
      value: "{{trip_confirmation_code}}"
  post:
  - field_equals:
      field: {resource_id: field_confirmation, text: Confirmation code, kind: EditText}
      value: "{{trip_confirmation_code}}"
  risk: reversible
  note: trace step 2
- id: enter_last_name
  intent: "Enter {{user_last_name}} into the Last name field"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    type:
      field:
        resource_id: field_last_name
        text: Last name
        hint: Last name
        kind: EditText
        cls: EditText
        siblings: [Find a trip]
        in_list: true
        position: [0.5, 0.307]
      value: "{{user_last_name}}"
  post:
  - field_equals:
      field: {resource_id: field_last_name, text: Last name, kind: EditText}
      value: "{{user_last_name}}"
  risk: reversible
  note: trace step 3
- id: find_open_matching_trip
  intent: "Scroll to {{trip_confirmation_code}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: "trip_row_{{trip_confirmation_code}}"
        text_has: "{{trip_confirmation_code}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: "trip_row_{{trip_confirmation_code}}"
      text_has: "{{trip_confirmation_code}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_matching_trip
  intent: "Tap the trip row matching {{trip_confirmation_code}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: "trip_row_{{trip_confirmation_code}}"
      text_has: "{{trip_confirmation_code}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: row_confirmation
      text: Confirmation
      text_has: "{{trip_confirmation_code}}"
      kind: Text
  risk: reversible
  extract:
    destination:
      near: Trip to
      locator: {resource_id: screen_title, kind: Text}
  note: trace step 4
