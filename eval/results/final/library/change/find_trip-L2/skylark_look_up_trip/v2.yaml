routine: skylark_look_up_trip
app: com.skylark.air
version: 2
status: active
intent: Look up a SkyLark trip by confirmation code
description: Open SkyLark Air My Trips, select the trip matching the given confirmation code, and report where that trip goes.
patterns: [look up my trip, where does my trip go, find my trip with my confirmation code, tell me my trip destination]
outputs: [destination]
start: fresh_launch
inputs:
  trip_confirmation_code: {type: text, description: Confirmation code of the trip to look up., example: PT4R8Z}
steps:
- id: open_my_trips
  intent: Open My Trips
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: find_open_trip_by_confirmation_code
  intent: "Scroll to {{trip_confirmation_code}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: "trip_row_{{trip_confirmation_code}}"
        text_has: "{{trip_confirmation_code}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: "trip_row_{{trip_confirmation_code}}"
      text_has: "{{trip_confirmation_code}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_trip_by_confirmation_code
  intent: "Open the trip showing confirmation code {{trip_confirmation_code}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: "trip_row_{{trip_confirmation_code}}"
      text_has: "{{trip_confirmation_code}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, kind: Text}
  - element_present: {resource_id: row_confirmation, text: Confirmation, kind: Text}
  risk: reversible
  extract:
    destination:
      near: Trip to
      locator: {resource_id: screen_title, kind: Text}
      first_in_list: false
      next_element: false
      expect_digits: false
  note: trace step 2
