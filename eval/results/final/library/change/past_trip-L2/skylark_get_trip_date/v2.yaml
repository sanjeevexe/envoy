routine: skylark_get_trip_date
app: com.skylark.air
version: 2
status: active
intent: Find the date of a past SkyLark flight to a city
description: Opens My Trips in SkyLark Air, finds the past trip to the requested city, opens its details, and reads the flight date from the trip
  details screen.
patterns: [When did I fly to a city, When was my flight to a city, What date was my trip to a city, When did I travel to a city]
outputs: [flight_date, flight]
start: fresh_launch
inputs:
  trip_city: {type: text, description: The destination city of the past trip to look up., example: Seattle}
steps:
- id: open_my_trips
  intent: Open My Trips to access trip history
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: scroll_to_trip
  intent: "Scroll until the past trip to {{trip_city}} is visible"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: trace step 2 (+1 scrolls)
- id: open_trip_details
  intent: "Tap the past trip to {{trip_city}} to open its details and read the flight date"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: text_checked_in, text: You're checked in, kind: Text}
  risk: reversible
  extract:
    flight_date:
      near: Date
      locator: {resource_id: row_date, kind: Text}
      segment: 1
      first_in_list: false
      next_element: false
      expect_digits: false
    flight:
      locator: {resource_id: text_flight, kind: Text}
      first_in_list: false
      next_element: false
      expect_digits: false
  note: trace step 3
