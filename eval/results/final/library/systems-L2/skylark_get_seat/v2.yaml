routine: skylark_get_seat
app: com.skylark.air
version: 2
status: active
intent: Get the seat assignment for a SkyLark flight
description: Open My Trips in SkyLark Air, select the trip to the requested city, and read the seat assignment from the trip details.
patterns: [What seat do I have on my flight, What is my seat assignment, Show my seat for my flight]
outputs: [seat]
start: fresh_launch
inputs:
  trip_city: {type: text, description: City of the destination for the trip whose seat is requested, example: Denver}
steps:
- id: tap_my_trips
  intent: Tap My Trips
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: find_tap_trip_row
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: tap_trip_row
  intent: "Tap the trip to {{trip_city}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: btn_checkin, text: Check in, kind: Button}
  risk: reversible
  extract:
    seat:
      near: Seat
      locator: {resource_id: row_seat, kind: Text}
      segment: 1
      expect_digits: true
  note: trace step 2
