routine: skylark_change_seat
app: com.skylark.air
version: 1
status: draft
intent: Change the seat on a SkyLark flight
description: Open a SkyLark trip for the requested city in My Trips, open the seat map, select the requested available seat, confirm the change,
  and return to the trip details to verify the new seat.
patterns: [Change my seat, Change my seat on my flight, Pick a different seat for my trip, Move to another seat]
outputs: [seat, gate, boarding, confirmation]
start: fresh_launch
inputs:
  trip_city: {type: text, description: City of the flight / trip to open, example: Denver}
  desired_seat: {type: text, description: Seat to change to, example: 21C}
steps:
- id: open_my_trips
  intent: Tap My Trips
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: find_open_trip
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_trip
  intent: "Open the {{trip_city}} trip from the list"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: btn_checkin, text: Check in, kind: Button}
  risk: reversible
  note: trace step 2
- id: open_change_seat
  intent: Tap Change seat to open the seat map
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_change_seat
      text: Change seat
      kind: Button
      cls: View
      siblings: [Known traveler number]
      in_list: false
      position: [0.5, 0.55]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: list_seats, kind: List}
  risk: reversible
  note: trace step 3
- id: find_select_seat
  intent: "Scroll to {{desired_seat}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: "seat_{{desired_seat}}"
        text: Seat
        text_has: "{{desired_seat}}"
        kind: Button
        cls: View
        parent: list_seats
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: "seat_{{desired_seat}}"
      text: Seat
      text_has: "{{desired_seat}}"
      kind: Button
      cls: View
      parent: list_seats
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: select_seat
  intent: "Tap seat {{desired_seat}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: "seat_{{desired_seat}}"
      text: Seat
      text_has: "{{desired_seat}}"
      kind: Button
      cls: View
      parent: list_seats
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: text_seat_selection
      text: "Selected: {{desired_seat}}"
      kind: Text
  - element_present: {resource_id: btn_confirm_seat, text: Confirm seat, kind: Button}
  risk: reversible
  note: trace step 4
- id: confirm_seat
  intent: Tap Confirm seat to save the seat change
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_confirm_seat
      text: Confirm seat
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.957]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: text_seat_selection
      text: "Your seat: {{desired_seat}}. Tap a seat to change it."
      kind: Text
  - element_present:
      resource_id: text_seat_message
      text: "Seat changed to {{desired_seat}}"
      kind: Text
  risk: irreversible
  note: trace step 5
- id: back_to_trip
  intent: Tap Back to return to the trip details and verify the new seat
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_back
      text: Back
      kind: Button
      cls: View
      in_list: false
      position: [0.069, 0.089]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present:
      resource_id: row_seat
      text: Seat
      text_has: "{{desired_seat}}"
      kind: Text
  risk: reversible
  extract:
    seat:
      near: Seat
      locator: {resource_id: row_seat, kind: Text}
      segment: 1
      expect_digits: true
    gate:
      near: Gate
      locator: {resource_id: row_gate, kind: Text}
      segment: 1
    boarding:
      near: Boarding
      locator: {resource_id: row_boarding, kind: Text}
      expect_digits: true
    confirmation:
      near: Confirmation
      locator: {resource_id: row_confirmation, kind: Text}
      segment: 1
  note: trace step 6
done:
- text_visible: "{{desired_seat}}"
