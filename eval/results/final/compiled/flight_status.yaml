routine: skylark_check_flight_status
app: com.skylark.air
version: 1
status: draft
intent: Check the status of a SkyLark flight
description: Opens SkyLark Flight status, enters a flight number, searches, and returns the resulting flight status line.
patterns: [what's the status of my flight, check flight status, is my flight delayed, look up a flight]
outputs: [flight_status]
start: fresh_launch
inputs:
  flight_number: {type: text, description: SkyLark flight number to look up, example: SL 1190}
steps:
- id: open_flight_status
  intent: Tap Flight status to open flight status lookup
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_status
      text: Flight status
      kind: Button
      cls: View
      in_list: false
      position: [0.628, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Flight status, kind: Text}
  - element_present: {resource_id: nav_status, text: Flight status, kind: Text}
  risk: reversible
  note: trace step 1
- id: enter_flight_number
  intent: "Enter {{flight_number}} into the Flight number field"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    type:
      field:
        resource_id: field_flight_number
        text: Flight number
        hint: Flight number
        kind: EditText
        cls: EditText
        siblings: [Check any SkyLark flight]
        in_list: false
        position: [0.5, 0.215]
      value: "{{flight_number}}"
  post:
  - field_equals:
      field: {resource_id: field_flight_number, text: Flight number, kind: EditText}
      value: "{{flight_number}}"
  risk: reversible
  note: trace step 2
- id: search_flight
  intent: "Tap Search to look up {{flight_number}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_search_status
      text: Search
      kind: Button
      cls: View
      siblings: [Check any SkyLark flight]
      in_list: false
      position: [0.5, 0.29]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: text_status_result
      text: "{{flight_number}}"
      kind: Text
  risk: reversible
  extract:
    flight_status:
      locator: {resource_id: text_status_result, kind: Text}
  note: trace step 3
