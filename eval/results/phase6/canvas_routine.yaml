routine: skylark_change_seat
app: com.skylark.air
version: 1
status: draft
intent: Change the seat on a SkyLark flight
description: Open a SkyLark trip for the requested city, open seat selection, choose the requested seat, and confirm the change.
patterns: [Change my seat on my flight, Change the seat for my trip, Move to a different seat on my flight]
outputs: [seat]
start: fresh_launch
inputs:
  trip_city: {type: text, description: City of the trip/flight whose seat should be changed., example: Denver}
  new_seat: {type: text, description: The new seat to select., example: 10C}
steps:
- id: tap_my_trips
  intent: Tap My Trips
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 6
- id: find_open_trip
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: open_trip
  intent: "Tap the trip to {{trip_city}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: btn_checkin, text: Check in, kind: Button}
  risk: reversible
  note: trace step 7
- id: tap_change_seat
  intent: Tap Change seat
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_change_seat
      text: Change seat
      kind: Button
      cls: View
      siblings: [Known traveler number]
      in_list: false
      position: [0.5, 0.55]
  post:
  - {screen_changed: true}
  - element_absent:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  risk: reversible
  note: trace step 8
- id: select_seat
  intent: "Tap seat {{new_seat}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      visual: "seat {{new_seat}}"
      crop: 
      region: [0.409, 0.205, 0.506, 0.247]
      density: 420
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: text_seat_selection
      text: "Selected: {{new_seat}}"
      kind: Text
  - element_present: {resource_id: btn_confirm_seat, text: Confirm seat, kind: Button}
  risk: reversible
  note: trace step 10
- id: tap_confirm_seat
  intent: Tap Confirm seat
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_confirm_seat
      text: Confirm seat
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.957]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: text_seat_selection
      text: "Your seat: {{new_seat}}. Tap a seat to change it."
      kind: Text
  - element_present:
      resource_id: text_seat_message
      text: "Seat changed to {{new_seat}}"
      kind: Text
  risk: irreversible
  extract:
    seat:
      near: "Your seat:"
      locator: {resource_id: text_seat_selection, kind: Text}
      after: . Tap a seat to change it.
      first_in_list: false
      next_element: false
      expect_digits: true
  note: trace step 11
done:
- text_visible: "{{new_seat}}"
compiled_from:
  task_id: p6-canvas-src
  goal: Change my seat on my Denver flight to 10C.
  compiler: muse-wonder-1.0
  compiled_at: "2026-10-27 20:32:14"
