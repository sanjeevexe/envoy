routine: chrome_wikipedia_opened_year
app: com.android.chrome
version: 1
status: active
intent: Search Wikipedia in Chrome for a topic and report the year it opened
description: Open Wikipedia in Chrome, search for the requested topic, scroll through its article to find when it opened, and return the opening
  year.
patterns: [search Wikipedia for something, look something up on Wikipedia, find what year something opened on Wikipedia, check Wikipedia for when
    something opened]
outputs: [opened_year]
start: fresh_launch
inputs:
  website_url: {type: text, description: The Wikipedia site to open in Chrome, example: en.m.wikipedia.org}
  search_query: {type: text, description: The topic to search for on Wikipedia, example: Eiffel Tower}
steps:
- id: type_wikipedia_url
  intent: "Type {{website_url}} into the Chrome address bar"
  pre:
  - {app_foreground: com.android.chrome}
  - element_present: {resource_id: compositor_view_holder, text: Web View, kind: Text}
  action:
    type:
      field:
        resource_id: url_bar
        text: "Search Google or type URL: about:blank"
        hint: Search Google or type URL
        kind: EditText
        cls: EditText
        parent: location_bar
        in_list: false
        position: [0.418, 0.084]
      value: "{{website_url}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present: {resource_id: location_bar_status_icon_view, text: Connection is secure, kind: Text}
  - element_present: {resource_id: location_bar_status, text: Connection is secure, kind: Button}
  risk: reversible
  note: trace step 1
- id: tap_search
  intent: Tap Search to open the site search
  pre:
  - {app_foreground: com.android.chrome}
  action:
    tap:
      resource_id: searchIcon
      text: Search
      kind: Button
      cls: Button
      in_list: true
      position: [0.83, 0.143]
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: url_bar
      text: "Search Google or type URL: en.wikipedia.org/wiki/Main_Page#/search"
      kind: EditText
  risk: reversible
  note: trace step 2
- id: type_search_query
  intent: "Type {{search_query}} into the Wikipedia search field"
  pre:
  - {app_foreground: com.android.chrome}
  action:
    type:
      field:
        text: ''
        kind: EditText
        cls: EditText
        in_list: false
        position: [0.538, 0.146]
      value: "{{search_query}}"
      submit: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: url_bar
      text: "Search Google or type URL: en.wikipedia.org/wiki/Eiffel_Tower"
      kind: EditText
  risk: reversible
  extract:
    opened_year:
      near: ": what does the page say? (opened year)"
      from_screenshot: \b(1\d|20)\d{2}\b
  note: trace step 3
