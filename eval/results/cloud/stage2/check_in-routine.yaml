routine: skylark_check_in_flight
app: com.skylark.air
version: 1
status: draft
intent: Check in for a SkyLark flight
description: Opens My Trips in SkyLark Air, selects the trip to the requested city, completes the passenger and hazardous materials steps, confirms
  check-in, and returns the boarding pass details.
patterns: [Check me in for my flight, Check in for my upcoming flight, Get my boarding pass]
outputs: [seat, gate, boarding_time, boarding_group]
start: fresh_launch
inputs:
  trip_city: {type: text, description: The destination city of the flight to check in for., example: Denver}
steps:
- id: open_my_trips
  intent: "Open My Trips to find the {{trip_city}} flight"
  pre:
  - {app_foreground: com.skylark.air}
  - element_present: {resource_id: screen_title, text: SkyLark Air, kind: Text}
  action:
    tap:
      resource_id: nav_trips
      text: My Trips
      kind: Button
      cls: View
      in_list: false
      position: [0.373, 0.93]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: My Trips, kind: Text}
  - element_present: {resource_id: nav_trips, text: My Trips, kind: Text}
  risk: reversible
  note: trace step 1
- id: find_select_trip
  intent: "Scroll to {{trip_city}} if it is not on screen"
  action:
    scroll_until:
      target:
        resource_id: trip_row_*
        text_has: "{{trip_city}}"
        kind: Button
        cls: View
        parent: list_trips
        in_list: true
      direction: down
      max_scrolls: 8
  post:
  - element_present:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  risk: read
  note: "added: input-based list choice"
- id: select_trip
  intent: "Open the trip to {{trip_city}}"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: trip_row_*
      text_has: "{{trip_city}}"
      kind: Button
      cls: View
      parent: list_trips
      in_list: true
  post:
  - {screen_changed: true}
  - element_present:
      resource_id: screen_title
      text: "Trip to {{trip_city}}"
      kind: Text
  - element_present: {resource_id: btn_checkin, text: Check in, kind: Button}
  risk: reversible
  note: trace step 2
- id: start_check_in
  intent: "Start check-in for the {{trip_city}} flight"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_checkin
      text: Check in
      kind: Button
      cls: View
      siblings: [Known traveler number]
      in_list: false
      position: [0.5, 0.484]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: cb_passenger_0, kind: Toggle}
  - element_present: {resource_id: btn_continue, text: Continue, kind: Button}
  risk: reversible
  note: trace step 3
- id: select_passenger
  intent: Select the passenger for check-in
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: cb_passenger_0
      kind: Toggle
      cls: View
      siblings: ['Who''s checking in?']
      in_list: false
      position: [0.5, 0.238]
  post:
  - toggle_is:
      target: {resource_id: cb_passenger_0, kind: Toggle}
      value: 'on'
  risk: reversible
  note: trace step 4
- id: continue_after_passenger
  intent: Continue after selecting the passenger
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_continue
      text: Continue
      kind: Button
      cls: View
      siblings: ['Who''s checking in?']
      in_list: false
      position: [0.5, 0.295]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: cb_hazmat, text: I'm not carrying hazardous materials, kind: Toggle}
  risk: reversible
  note: trace step 5
- id: confirm_no_hazardous_materials
  intent: Confirm not carrying hazardous materials
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: cb_hazmat
      text: I'm not carrying hazardous materials
      kind: Toggle
      cls: View
      siblings: [Travel safety, 'Lithium batteries, fireworks, flammable liquids and other hazardous materials are not allowed in checked or carry-on
          bags.']
      in_list: false
      position: [0.5, 0.33]
  post:
  - toggle_is:
      target: {resource_id: cb_hazmat, text: I'm not carrying hazardous materials, kind: Toggle}
      value: 'on'
  risk: reversible
  note: trace step 6
- id: continue_after_hazmat
  intent: Continue after the hazardous materials declaration
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_continue
      text: Continue
      kind: Button
      cls: View
      siblings: [Travel safety, 'Lithium batteries, fireworks, flammable liquids and other hazardous materials are not allowed in checked or carry-on
          bags.']
      in_list: false
      position: [0.5, 0.388]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: btn_confirm_checkin, text: Confirm check-in, kind: Button}
  - element_present: {resource_id: row_confirm_passenger, text: Passenger, kind: Text}
  risk: reversible
  note: trace step 7
- id: confirm_check_in
  intent: "Confirm check-in for the {{trip_city}} flight"
  pre:
  - {app_foreground: com.skylark.air}
  action:
    tap:
      resource_id: btn_confirm_checkin
      text: Confirm check-in
      kind: Button
      cls: View
      in_list: false
      position: [0.5, 0.365]
  post:
  - {screen_changed: true}
  - element_present: {resource_id: screen_title, text: Boarding pass, kind: Text}
  - element_present: {resource_id: text_checked_in, text: You're checked in, kind: Text}
  risk: irreversible
  extract:
    seat:
      near: Seat
      locator: {resource_id: row_bp_seat, kind: Text}
      segment: 1
      expect_digits: true
    gate:
      near: Gate
      locator: {resource_id: row_bp_gate, kind: Text}
      segment: 1
    boarding_time:
      near: Boarding
      locator: {resource_id: row_bp_boarding, kind: Text}
      segment: 1
      expect_digits: true
    boarding_group:
      near: Boarding
      locator: {resource_id: row_bp_boarding, kind: Text}
      segment: 2
  note: trace step 8
done:
- element_present: {text: Boarding pass}
