routine: youtube_short_sound
app: com.google.android.youtube
version: 2
status: active
intent: Post the newest gallery video as a YouTube Short with a chosen sound and title
description: Prepares a YouTube Short from the newest video in the phone gallery, adds a chosen sound from the YouTube sound library, and enters
  the requested title before upload.
patterns: [post my newest video to YouTube as a Short, upload the latest gallery video as a Short with this sound, make a YouTube Short from my
    newest clip, turn the newest video in my gallery into a Short]
start: fresh_launch
inputs:
  sound_title: {type: text, description: Title of the sound to search for in YouTube's sound library, example: golden hour}
  sound_artist: {type: text, description: 'Artist credited for the requested sound, used to pick the correct search result', example: JVKE}
  short_title:
    type: text
    description: Title or caption to enter for the Short
    example: "Envoy rehearsal: one clip, three apps"
