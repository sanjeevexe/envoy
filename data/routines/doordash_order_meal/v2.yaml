routine: doordash_order_meal
app: com.dd.doordash
version: 2
status: active
intent: Order a specified meal from a restaurant on DoorDash
description: Searches DoorDash for a restaurant, builds the meal with its option, side and drink, adds it to the cart, and continues from the
  cart to checkout.
patterns: [Order my usual on DoorDash, Order a meal on DoorDash, Get a sandwich meal delivered, Order my usual fast-food meal]
start: fresh_launch
inputs:
  restaurant_name: {type: text, description: Restaurant to search for and open on DoorDash, example: Chick-fil-A}
  meal_item: {type: text, description: The meal as the restaurant's menu names it, example: Deluxe Meal}
  meal_option: {type: text, description: 'The meal''s cheese by its name alone, as the menu writes it after ''w/'' (American, Colby Jack, Pepper
      Jack, No Cheese)', example: American}
  side_option: {type: text, description: 'The meal''s side, as the menu names it', example: Waffle Potato Fries}
  beverage_option: {type: text, description: 'The meal''s drink, as the menu names it', example: Frosted Lemonade}
